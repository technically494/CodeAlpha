{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h1>🛒 My E-Commerce Store</h1>

        <div>
            <a href="/">Home</a>
            <a href="{% url 'cart' %}">Cart 🛒</a>
            <a href="{% url 'login' %}">Login</a>
        </div>
    </nav>


    <!-- Registration Form -->

    <div class="container">

        <div class="product-card" style="max-width: 500px; margin: auto;">

            <h2>👤 Create Account</h2>

            <form method="POST">

                {% csrf_token %}

                <label>Username:</label>
                <br>

                <input type="text"
                       name="username"
                       required
                       style="width: 100%; padding: 12px; margin: 10px 0;">

                <label>Password:</label>
                <br>

                <input type="password"
                       name="password"
                       required
                       style="width: 100%; padding: 12px; margin: 10px 0;">

                <br>

                <button type="submit" class="btn">
                    Register
                </button>

            </form>

            <br>

            <p>Already have an account?</p>

            <a href="{% url 'login' %}" class="btn">
                Login
            </a>

        </div>

    </div>


    <!-- Footer -->

    <footer class="footer">
        <p>© 2026 My E-Commerce Store | All Rights Reserved</p>
    </footer>

</body>
</html>
